name: Check Links

on:
  push:
    branches: ["master"]

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Check all Markdown, Text, and HTML files
          # 403 is Forbidden shown for doi.org
          # 429 is Too Many Requests (rate limiting, e.g., from gnu.org)
          args: --verbose --no-progress --max-concurrency 8 --max-retries 3 --retry-wait-time 10 --accept "100..=103, 200..=299, 403, 429" "**/*.md" "**/*.html" "**/*.Rd"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
