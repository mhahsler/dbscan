name: R native sanitizers

on:
  push:
    paths: ['src/**', 'R/**', 'tests/**', 'tools/**', 'DESCRIPTION', 'NAMESPACE', '.github/workflows/native-sanitizers.yaml']
  pull_request:
    paths: ['src/**', 'R/**', 'tests/**', 'tools/**', 'DESCRIPTION', 'NAMESPACE', '.github/workflows/native-sanitizers.yaml']
  workflow_dispatch:

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check
      - run: bash tools/test-native-sanitizers.sh
