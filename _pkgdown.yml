url: https://michael.hahsler.net/dbscan/
template:
  bootstrap: 5
  math-rendering: mathjax

reference:
- title: Clustering Algorithms
  desc: Cluster data with DBSCAN, OPTICS, HDBSCAN, shared nearest neighbor, and Jarvis-Patrick algorithms.
- subtitle: DBSCAN
  desc: Density-based spatial clustering of applications with noise.
  contents:
  - dbscan
- subtitle: OPTICS
  desc: Ordering points to identify the clustering structure.
  contents:
  - optics
- subtitle: HDBSCAN
  desc: Hierarchical DBSCAN, its minimum spanning tree hierarchy, and the extraction of clusters from hierarchies.
  contents:
  - hdbscan
  - extractFOSC
  - mst_dist
- subtitle: Shared Nearest Neighbor Clustering
  desc: Clustering based on shared nearest neighbor graphs.
  contents:
  - sNNclust
  - jpclust
- subtitle: Cluster Summaries
  desc: Count clusters, noise points, and observations.
  contents:
  - ncluster
- title: Nearest Neighbor Search
  desc: Find k-nearest, fixed-radius, and shared nearest neighbors and work with nearest-neighbor graphs.
  contents:
  - kNN
  - frNN
  - sNN
  - kNNdist
  - has_concept("NN functions")
- title: Outlier Detection
  desc: Calculate local and hierarchical outlier scores and estimate local point density.
  contents:
  - lof
  - glosh
  - pointdensity
  - has_concept("Outlier Detection Functions")
- title: Clustering Evaluation
  desc: Evaluate density-based clusterings with the Density-Based Clustering Validation index.
  contents:
  - dbcv
  - has_concept("Evaluation Functions")
- title: Cluster Visualization and Hierarchies
  desc: Plot clusters and work with reachability plots and cluster hierarchies.
  contents:
  - hullplot
  - reachability
  - dendrogram
- title: Tidiers
  desc: Turn clustering objects into tidy tibbles and augment the original data.
  contents:
  - has_concept("tidiers")
- title: Data Sets
  desc: Example and benchmark data sets for density-based clustering.
  contents:
  - moons
  - DS3
  - DBCV_datasets

